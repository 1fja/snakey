<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Secure Relay</title>

<style>
body {
  background:#0b0b0b;
  color:#eee;
  font-family: monospace;
  text-align:center;
}

#chat {
  display:none;
  width:400px;
  margin:20px auto;
}

#messages {
  height:250px;
  border:1px solid #444;
  padding:10px;
  overflow-y:auto;
  margin-bottom:10px;
  text-align:left;
}

input {
  width:70%;
  padding:6px;
}

button {
  padding:6px 10px;
  margin:5px;
}
</style>
</head>

<body>

<h2 id="status">Not connected</h2>

<button onclick="openInvite()">Create Invite</button>
<button onclick="connectPeer()">Connect Peer</button>

<div id="chat">
  <div id="messages"></div>

  <input id="msg" placeholder="type message" />
  <button onclick="sendMsg()">Send</button>
</div>

<script src="https://unpkg.com/openpgp@5.11.0/dist/openpgp.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
